[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "second-brain"
version = "0.1.0"
description = "Local-first Windows desktop app for learning and research: a markdown vault with keyword + semantic search and local AI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
]
dependencies = [
    "PySide6>=6.6",
    "PyYAML>=6.0",
    "pypdf>=4.0",
    "sqlite-vec>=0.1.6",
    "httpx>=0.27",
    "watchdog>=4.0",
    "faster-whisper>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.5",
]

[project.gui-scripts]
second-brain = "second_brain.__main__:main"

[project.scripts]
second-brain-cli = "second_brain.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/second_brain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
qt_api = "pyside6"
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM105"]
